server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Default nginx limit is 1MB, well under the backend's largest [RequestSizeLimit] (20MB on
    # KnowledgeBaseController) — without this, uploads above 1MB get a 413 straight from nginx
    # and never reach the backend, regardless of the uploader's role/permissions.
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html has no content hash in its filename, so unlike /assets/* it must never be
        # cached -- otherwise a browser holding a stale copy after a rebuild keeps requesting
        # JS/CSS filenames that Vite has already deleted (each build replaces /assets/ with newly
        # hashed names), and the whole SPA fails to mount with what looks like a blank/broken page.
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        # Filenames are content-hashed by Vite, so a given filename's contents never change --
        # safe to cache aggressively and skip revalidation entirely.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SignalR hub (real-time notifications) — was previously missing entirely, which meant
    # every SignalR connection attempt fell through to the SPA fallback below and 404'd,
    # silently degrading to 30s polling with no real-time toasts.
    location /hubs/ {
        proxy_pass http://backend:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s; # long-lived SignalR connections shouldn't be cut by the default 60s
    }
}
