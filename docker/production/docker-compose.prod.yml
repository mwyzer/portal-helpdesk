# Production compose file. Differs from the root docker-compose.yml (local dev) in:
# - all secrets/config come from environment variables (see .env.example), nothing hardcoded
# - postgres is not exposed on the host at all (only reachable from the backend container)
# - a reverse-proxy nginx container terminates TLS and fronts both frontend + backend, replacing
#   the frontend image's own baked-in nginx.conf (see nginx-ssl.conf.example in this directory)
# - restart policies and log rotation are set explicitly
#
# Deliberately NOT included, to avoid deploying infrastructure the app doesn't use yet:
# - Redis: no caching code exists in the app yet (see documentation/todo-phase-7-hardening.md,
#   "Configure Redis caching for reference data" is still unchecked). Add this service when
#   that code lands, not before.
# - A separate "worker" container: all background jobs (TicketSlaBackgroundService,
#   ActionItemReminderBackgroundService) run as IHostedService inside the API process already.
#   There's no separate worker codebase to containerize — splitting it out now would deploy an
#   empty container.
#
# Usage:
#   cp .env.example .env   # fill in real values
#   docker compose -f docker/production/docker-compose.prod.yml --env-file .env up -d --build

services:
  postgres:
    build:
      context: ../..
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aihelpdesk}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Baseline tuning for a small VPS (4 cores / 8GB RAM, per the Phase 7 provisioning spec).
      # Re-tune with a tool like PGTune once real traffic/hardware is known.
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../..
      dockerfile: src/AIHelpdesk.Api/Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-aihelpdesk};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-AIHelpdesk}
      - Jwt__Audience=${JWT_AUDIENCE:-AIHelpdesk}
      - Cors__Origins__0=${FRONTEND_ORIGIN}
      - Uploads__Path=/app/uploads
      - AI__ApiKey=${AI_API_KEY}
      - AI__Endpoint=${AI_ENDPOINT:-https://api.openai.com/v1/}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ssl.conf.example:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renews twice a day if due (certbot no-ops when the cert isn't close to expiry).
    # First-time issuance still needs to be run manually once — see documentation/deployment-runbook.md.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

volumes:
  pgdata:
  uploads:
  certbot-etc:
  certbot-www:
